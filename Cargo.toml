[package]
name = "sigstore-verify"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
base64 = "0.22.1"
cms = "0.2.3"
der = "0.7.10"
ecdsa = "0.16.9"
ed25519-dalek = "2.2.0"
hex = { version = "0.4.3", features = ["serde"] }
tough = { git = "https://github.com/emilyalbini/tough", rev = "d29b2b08001085f1e0ba4ba40e18e1a956fbeb06", features = ["http"] }
jiff = { version = "0.2.15", features = ["serde"] }
p256 = "0.13.2"
p384 = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["io-util"] }
serde_json_canonicalizer = "0.3.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.17"
x509-cert = "0.2.5"
x509-tsp = "0.1.0"
futures = "0.3.32"

[dev-dependencies]
clap = { version = "4.5.51", features = ["derive"] }
expect-test = "1.5.1"
