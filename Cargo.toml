[package]
name = "sigstore-verify"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
cms = "0.2.3"
der = "0.7.10"
ecdsa = "0.16.9"
ed25519-dalek = "2.2.0"
expect-test = "1.5.1"
hex = { version = "0.4.3", features = ["serde"] }
jiff = { version = "0.2.15", features = ["serde"] }
p256 = "0.13.2"
p384 = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.17"
x509-cert = "0.2.5"
x509-tsp = "0.1.0"

[dev-dependencies]
clap = { version = "4.5.51", features = ["derive"] }
